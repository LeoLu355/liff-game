<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>新春輪盤活動</title>

  <!-- 🔑 關鍵：穩定 viewport（iOS 友善） -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="bg-particles"></div>

<div class="app">
  <div class="header">
    <div class="lantern l1"></div>
    <div class="lantern l2"></div>
    <h1>🧧 新春轉盤活動</h1>
    <p>轉出你的新年好運氣</p>
  </div>

  <div class="roulette-container">
    <div class="couplet left">招財進寶</div>

    <div class="wheel-area">
      <div class="pointer"></div>

      <div class="wheel-shell">
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
      </div>

      <button class="center-btn" id="spinBtn" type="button">
        <div class="glow-ring"></div>
        <span>開始轉</span>
        <small>恭喜發財</small>
      </button>
    </div>

    <div class="couplet right">五福臨門</div>
  </div>
</div>

<!-- 結果 Overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-envelope" id="resultEnvelope">
    <div class="envelope-top"></div>
    <div class="envelope-body">
      <div class="gold-light"></div>
      <div class="result-text" id="resultText">—</div>
      <div class="result-sub" id="resultSub">—</div>
      <button class="again-btn" id="againBtn">再轉一次</button>
      <button class="close-btn" id="closeBtn">關閉</button>
    </div>
  </div>
</div>

<script src="./roulette.js"></script>
</body>
</html>
