<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>🧧 馬年好運抽抽樂｜輪盤</title>
  <style>
    :root{
      --bg1:#7b0000;
      --bg2:#b80000;
      --gold:#f7d36b;
      --gold2:#f2b94b;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.12);
      --text:#fff7e6;
      --muted: rgba(255,247,230,.75);
      --shadow: 0 14px 50px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(255,214,102,.25), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, rgba(255,214,102,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding: 18px 14px 22px;
    }
    .wrap{
      width: min(460px, 100%);
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .header{
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 14px 14px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .header:before{
      content:"";
      position:absolute;
      inset:-40px -80px auto auto;
      width:220px;height:220px;
      background: radial-gradient(circle at 30% 30%, rgba(247,211,107,.45), transparent 65%);
      transform: rotate(18deg);
    }
    .title{
      font-weight: 800;
      letter-spacing: .5px;
      font-size: 18px;
      margin:0 0 4px 0;
    }
    .sub{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height:1.45;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .stats{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
      margin-top: 12px;
    }
    .stat{
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 10px 10px;
      text-align:center;
    }
    .stat .k{font-size:12px; color: var(--muted); margin-bottom:6px}
    .stat .v{font-size:18px; font-weight:800; color: #fff}
    .stat .v small{font-size:12px; font-weight:700; color: rgba(255,255,255,.8)}

    .wheel-area{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px 0 6px;
      position:relative;
    }

    /* pointer */
    .pointer{
      position:absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 22px solid var(--gold);
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
      z-index: 4;
    }
    .pointer:after{
      content:"";
      position:absolute;
      left:-10px;
      top:-24px;
      width:20px;height:20px;
      background: radial-gradient(circle at 35% 35%, #fff, var(--gold2));
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }

    /* wheel */
    .wheel{
      width: min(340px, 86vw);
      height: min(340px, 86vw);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.18), rgba(0,0,0,.25));
      padding: 10px;
      position:relative;
    }
    .wheel-inner{
      width:100%;
      height:100%;
      border-radius:50%;
      border: 2px solid rgba(255,255,255,.22);
      background: #8f0000;
      position:relative;
      overflow:hidden;
    }
    .rim{
      position:absolute;
      inset: -8px;
      border-radius:50%;
      border: 8px solid rgba(247,211,107,.32);
      pointer-events:none;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.25));
    }

    .center{
      position:absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%,-50%);
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--gold2));
      border: 2px solid rgba(255,255,255,.38);
      box-shadow: 0 14px 35px rgba(0,0,0,.35);
      z-index: 3;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 10px;
      font-weight: 900;
      color: #7b0000;
      line-height: 1.05;
      letter-spacing: .5px;
      user-select:none;
    }
    .center span{font-size: 13px;}
    .center small{display:block; font-size:10px; font-weight:800; opacity:.9; margin-top:3px}

    .labels{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      transform: rotate(0deg);
    }
    .label{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin: 0 0;
      width: 140px;
      text-align:left;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
      letter-spacing:.2px;
      user-select:none;
    }
    .label em{
      font-style: normal;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.14);
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top: 10px;
    }
    button{
      flex:1;
      appearance:none;
      border:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 900;
      letter-spacing:.6px;
      font-size: 15px;
      cursor:pointer;
      box-shadow: 0 10px 26px rgba(0,0,0,.25);
      transition: transform .08s ease, filter .2s ease, opacity .2s ease;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    .btn-primary{
      background: linear-gradient(180deg, #ffd56a, #f2b94b);
      color:#7b0000;
    }
    .btn-ghost{
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      box-shadow:none;
    }
    button[disabled]{ opacity:.55; cursor:not-allowed; }

    .result{
      margin-top: 12px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 12px;
      line-height:1.45;
    }
    .result .r-title{
      font-weight: 900;
      color: #fff;
      margin-bottom: 4px;
    }
    .result .r-sub{
      color: var(--muted);
      font-size: 13px;
    }

    .tiny{
      margin-top: 10px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.5;
    }

    /* confetti */
    .confetti{
      position: fixed;
      inset: 0;
      pointer-events:none;
      overflow:hidden;
      z-index: 50;
    }
    .confetti i{
      position:absolute;
      top:-12px;
      width: 10px;
      height: 16px;
      border-radius: 2px;
      opacity:.9;
      animation: fall linear forwards;
    }
    @keyframes fall{
      to { transform: translateY(110vh) rotate(360deg); opacity: .95; }
    }

    /* spin animation */
    .spin{
      transition: transform 4.3s cubic-bezier(.15,.8,.08,1);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">🧧 馬年好運抽抽樂｜紅包輪盤</h1>
      <p class="sub">
        點「開始轉」就會轉出一個獎項。這是第一版（純前端）用來確認 LIFF 跑得起來。
        下一步才會接後端（點數、每日限制、抽獎紀錄）。
      </p>

      <div class="stats">
        <div class="stat">
          <div class="k">紅包點（RP）</div>
          <div class="v" id="rp">100 <small>點</small></div>
        </div>
        <div class="stat">
          <div class="k">今日免費</div>
          <div class="v" id="free">1 <small>次</small></div>
        </div>
        <div class="stat">
          <div class="k">累計轉盤</div>
          <div class="v" id="cnt">0 <small>次</small></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="wheel-area">
        <div class="pointer"></div>

        <div class="wheel">
          <div class="rim"></div>
          <div class="wheel-inner" id="wheelInner">
            <canvas id="wheelCanvas" width="600" height="600" style="width:100%;height:100%;display:block;"></canvas>
            <div class="labels" id="labels"></div>
            <div class="center"><span>開始轉</span><small>好運來</small></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="spinBtn">🎡 開始轉</button>
        <button class="btn-ghost" id="resetBtn">重置</button>
      </div>

      <div class="result" id="resultBox">
        <div class="r-title">結果：尚未開始</div>
        <div class="r-sub">提示：第一版先做動畫與 UI，確定 LIFF 可以正常打開與操作。</div>
      </div>

      <div class="tiny">
        小提醒：如果你想要「每天限制 1 次、任務拿點數、抽獎紀錄、防刷」，下一步我會幫你接後端 API。
      </div>
    </div>
  </div>

  <div class="confetti" id="confetti"></div>

  <script>
    // ====== 獎項設定（你之後可以改機率/文字） ======
    // weight 越大越容易中
    const PRIZES = [
      { name: "RP +5",   weight: 50, reward: { rp: 5 },  kind: "rp" },
      { name: "RP +10",  weight: 20, reward: { rp: 10 }, kind: "rp" },
      { name: "再來一次 +1", weight: 12, reward: { free: 1 }, kind: "free" },
      { name: "扭蛋幣 +1", weight: 10, reward: { gacha: 1 }, kind: "gacha" },
      { name: "抽獎券 +1", weight: 6,  reward: { ticket: 1 }, kind: "ticket" },
      { name: "金獎碎片 +1", weight: 2, reward: { shard: 1 }, kind: "shard" },
    ];

    // ====== 狀態（純前端 demo） ======
    let rp = 100;
    let free = 1;
    let cnt = 0;
    let spinning = false;

    const elRp = document.getElementById("rp");
    const elFree = document.getElementById("free");
    const elCnt = document.getElementById("cnt");
    const spinBtn = document.getElementById("spinBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultBox = document.getElementById("resultBox");
    const wheelInner = document.getElementById("wheelInner");

    // ====== 畫輪盤（canvas） ======
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const radius = 275;
    const n = PRIZES.length;
    const slice = (Math.PI * 2) / n;

    function drawWheel() {
      ctx.clearRect(0,0,W,H);

      // background
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI*2);
      ctx.fillStyle = "#7f0000";
      ctx.fill();

      // slices
      for(let i=0;i<n;i++){
        const a0 = i*slice - Math.PI/2;
        const a1 = a0 + slice;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, a0, a1);
        ctx.closePath();

        // 交錯紅色深淺 + 金色點綴
        ctx.fillStyle = (i%2===0) ? "rgba(255,214,102,.32)" : "rgba(0,0,0,.18)";
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,.18)";
        ctx.lineWidth = 3;
        ctx.stroke();

        // text
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a0 + slice/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "rgba(255,255,255,.95)";
        ctx.font = "900 26px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans TC, Arial";
        ctx.fillText(PRIZES[i].name, radius - 18, 10);
        ctx.restore();
      }

      // inner glow
      ctx.beginPath();
      ctx.arc(cx, cy, radius-12, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(247,211,107,.25)";
      ctx.lineWidth = 10;
      ctx.stroke();
    }
    drawWheel();

    function updateStats(){
      elRp.textContent = rp + " ";
      elFree.textContent = free + " ";
      elCnt.textContent = cnt + " ";
    }
    updateStats();

    // ====== 抽獎（加權隨機） ======
    function pickPrizeIndex(){
      const total = PRIZES.reduce((s,p)=>s+p.weight,0);
      let r = Math.random()*total;
      for(let i=0;i<PRIZES.length;i++){
        r -= PRIZES[i].weight;
        if(r<=0) return i;
      }
      return PRIZES.length-1;
    }

    function applyReward(prize){
      if(prize.reward.rp) rp += prize.reward.rp;
      if(prize.reward.free) free += prize.reward.free;
      // 其他先不顯示數值（後端版會有）
    }

    // ====== 轉盤：用 transform 旋轉 wheelInner（含動畫） ======
    let currentRotation = 0; // degrees

    function spin(){
      if(spinning) return;

      // 免費次數用完就擋（demo）
      if(free <= 0){
        setResult("結果：今日免費已用完", "（Demo）下一步可做：用 RP 兌換轉盤次數 / 每日重置。");
        return;
      }

      spinning = true;
      spinBtn.disabled = true;

      const idx = pickPrizeIndex();
      const prize = PRIZES[idx];

      // 指針在正上方（-90deg），我們要讓目標 slice 中心對準指針
      // 每個 slice 中心角度 = (idx + 0.5) * (360/n)
      const degPer = 360 / n;
      const targetCenter = (idx + 0.5) * degPer;

      // wheelInner 旋轉方向：順時針，讓 targetCenter 到頂部（0deg 對應上方）
      // 目前 rotation 的「0」定義為 canvas 原始（文字已畫好），所以我們用公式對齊
      // 需要旋轉到： 360*X + (360 - targetCenter)
      const extraSpins = 6; // 轉幾圈（越大越爽）
      const finalRotation = extraSpins*360 + (360 - targetCenter);

      // 扣免費次數（demo）
      free -= 1;
      cnt += 1;
      updateStats();

      // 動畫
      const nextRotation = currentRotation + finalRotation;
      wheelInner.classList.add("spin");
      wheelInner.style.transform = `rotate(${nextRotation}deg)`;

      // 4.3s 後結算
      setTimeout(()=>{
        currentRotation = nextRotation % 360;

        // 結果顯示 + 套用獎勵
        applyReward(prize);
        updateStats();

        // 視覺效果
        if(prize.weight <= 6) burstConfetti(70);
        else if(prize.weight <= 12) burstConfetti(35);
        else burstConfetti(18);

        setResult(`結果：你抽到「${prize.name}」`, `恭喜！過年好運來～（下一版會把結果寫入後端紀錄）`);

        spinning = false;
        spinBtn.disabled = false;
      }, 4350);
    }

    function setResult(title, sub){
      resultBox.querySelector(".r-title").textContent = title;
      resultBox.querySelector(".r-sub").textContent = sub;
    }

    // ====== confetti ======
    const confetti = document.getElementById("confetti");
    function burstConfetti(count){
      confetti.innerHTML = "";
      const colors = ["#ffd56a","#f2b94b","#ffffff","rgba(255,255,255,.75)"];
      for(let i=0;i<count;i++){
        const el = document.createElement("i");
        const left = Math.random()*100;
        const delay = Math.random()*0.15;
        const dur = 1.4 + Math.random()*1.2;
        const sizeW = 6 + Math.random()*10;
        const sizeH = 10 + Math.random()*18;

        el.style.left = left + "vw";
        el.style.animationDelay = delay + "s";
        el.style.animationDuration = dur + "s";
        el.style.width = sizeW + "px";
        el.style.height = sizeH + "px";
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.transform = `translateY(0) rotate(${Math.random()*180}deg)`;
        confetti.appendChild(el);

        // random drift
        el.animate(
          [
            { transform: `translateY(0) translateX(0) rotate(0deg)` },
            { transform: `translateY(110vh) translateX(${(Math.random()*2-1)*140}px) rotate(${360+Math.random()*360}deg)` }
          ],
          { duration: dur*1000, delay: delay*1000, fill: "forwards", easing: "linear" }
        );
      }
      setTimeout(()=>{ confetti.innerHTML=""; }, 2600);
    }

    // ====== events ======
    spinBtn.addEventListener("click", spin);
    resetBtn.addEventListener("click", ()=>{
      spinning = false;
      spinBtn.disabled = false;
      rp = 100; free = 1; cnt = 0;
      updateStats();
      wheelInner.classList.remove("spin");
      wheelInner.style.transform = "rotate(0deg)";
      currentRotation = 0;
      setResult("結果：已重置", "提示：點「開始轉」測試輪盤。");
    });

    // 小補丁：在某些手機上，第一次觸控會選取文字，這裡避免
    document.addEventListener("touchstart", ()=>{}, {passive:true});
  </script>
</body>
</html>
